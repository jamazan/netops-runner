services:
  backend:
    build: ./backend
    container_name: netops-backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./ssh:/app/ssh:ro
      - ./faults:/app/faults:ro
    env_file:
      - .env
    networks:
      - netops

  frontend:
    build: ./frontend
    container_name: netops-frontend
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/eval-framework.js:/usr/share/nginx/html/eval-framework.js:ro
    depends_on:
      - backend
    networks:
      - netops

networks:
  netops:
    driver: bridge
